name: Audit Flux UI documentation

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare live documentation with the bundle
        run: python3 scripts/fluxui_docs.py audit --json > "$RUNNER_TEMP/fluxui-audit.json"
      - name: Notify maintainers of new or changed components
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'fluxui-audit.json').read_text())
          changes = report['changes']
          if changes:
              lines = [
                  'The live Flux UI documentation differs from the bundled component snapshot.',
                  '',
                  'The skill already uses the live page for new or changed components. Review these pages and update the local notes and hashes when ready.',
                  '',
              ]
              for item in changes:
                  lines.append(f"- **{item['status']}**: [{item['slug']}]({item['url']})" + (f" — SHA-256 `{item['source_sha256']}`" if 'source_sha256' in item else ''))
              (Path(os.environ['RUNNER_TEMP']) / 'fluxui-issue.md').write_text('\n'.join(lines) + '\n')
          PY
          title='Flux UI documentation differs from bundled notes'
          issue=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Flux UI documentation differs from bundled notes") | .number' | head -n 1)
          if [ -s "$RUNNER_TEMP/fluxui-issue.md" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/fluxui-issue.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/fluxui-issue.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment 'The bundled component snapshot now matches the live Flux UI documentation.'
          fi
